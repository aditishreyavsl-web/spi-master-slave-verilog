name: Simulation

on:
  push:
  pull_request:

jobs:
  simulate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Icarus Verilog
        run: sudo apt-get update && sudo apt-get install -y iverilog
      - name: Run testbench
        run: make run
      - name: Upload waveform
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spi_tb-vcd
          path: build/spi_tb.vcd
